<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <h2>task 5 of form by css</h2>

    <fieldset>
        <h3>Application Form</h3>
        <br>
        <fieldset>
            <legend>Personal Details</legend>

            <div>
                <label for="name">Application's full name</label>
                <select name="name" id="name">
                    <option value="">--Select--</option>
                </select>
                <input type="" name="" value="">

                <label for="in">Care of</label>
                <span>Parents</span>
                <input type="radio" name="v" id="in" value="parents">
                <span>Guardian</span>
                <input type="radio" name="v" id="in" value="guardian">

                <label for="fname">Father's Name</label>
                <select name="fname" id="fname">
                    <option value="">Mr.</option>
                </select>
                <input type="text" name="fname" id="fname">

                <label for="mname">Mother's Name</label>
                <select name="mname" id="mname">
                    <option value="">Mrs.</option>
                </select>
                <input type="text" name="mname" id="fname">

                <label for="gender">Gender</label>
                <span>Male</span>
                <input type="radio" name="m" id="gender" value="male">
                <span>Female</span>
                <input type="radio" name="m" id="gender" value="female">
                <span>Other</span>
                <input type="radio" name="m" id="gender" value="other">

                <label for="dob">Date Of Birth</label>
                <input type="date" name="dob" id="dob">

                <label for="marital">Marital Status</label>
                <select name="marital" id="marital">
                    <option value="">--Select--</option>
                </select>

                <label for="category">Category</label>
                <select name="category" id="category">
                    <option value="">--Select--</option>
                </select>

                <label for="handicapped">Handicapped</label>
                <span>No</span>
                <input type="radio" name="x" id="handicapped" value="no">
                <span>Yes</span>
                <input type="radio" name="x" id="handicapped" value="yes">

                <label for="ex_serv">Ex-Serviceman</label>
                <span>No</span>
                <input type="radio" name="x" id="ex_serv" value="no">
                <span>Yes</span>
                <input type="radio" name="x" id="ex_serv" value="yes">

                <label for="ews">EWS</label>
                <span>No</span>
                <input type="radio" name="x" id="ews" value="no">
                <span>Yes</span>
                <input type="radio" name="x" id="ews" value="yes">

                <label for="religion">Religion</label>
                <select name="relig_" id="religion">
                    <option value="">--Select--</option>
                </select>
            </div>

            <div>
                <label for="contactnum">Mobile Number</label>
                <input type="text" name="contactnum" id="contactnum">

                <label for="mail">Email ID</label>
                <input type="text" name="mail" id="mail">

                <label for="address1">Address Line 1</label>
                <input type="text" name="address1" id="address1">

                <label for="address2">Address Line 2</label>
                <input type="text" name="address2" id="address2">

                <label for="city">City</label>
                <input type="text" name="city" id="city">

                <label for="state">State</label>
                <select name="state" id="state">
                    <option value="">--Select--</option>
                </select>

                <td><label for="pinCode">PIN Code</label></td>
                <input type="text" name="pinCode" id="pinCode">
            </div>

            <div>

                
            </div>

        </fieldset>
    </fieldset>
</body>

</html>
