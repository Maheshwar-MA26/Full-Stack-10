<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Course Registration</title>

  <!-- Bootstrap CSS -->
  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
    rel="stylesheet"
  >
</head>

<body>

  <div class="container mt-4">

    <h2>Course Registration</h2>

    <form>

      <!-- First Name and Last Name -->
      <div class="row">

        <div class="col-md-6 mb-3">
          <label for="firstName" class="form-label">
            First Name
          </label>

          <input
            type="text"
            class="form-control"
            id="firstName"
            placeholder="Enter first name"
          >
        </div>

        <div class="col-md-6 mb-3">
          <label for="lastName" class="form-label">
            Last Name
          </label>

          <input
            type="text"
            class="form-control"
            id="lastName"
            placeholder="Enter last name"
          >
        </div>

      </div>

      <!-- Full Name -->
      <div class="mb-3">
        <label for="fullName" class="form-label">
          Full Name
        </label>

        <input
          type="text"
          class="form-control"
          id="fullName"
          placeholder="Enter full name"
        >
      </div>

      <!-- Email with Validation Error -->
      <div class="mb-3">
        <label for="email" class="form-label">
          Email
        </label>

        <input
          type="email"
          class="form-control is-invalid"
          id="email"
          placeholder="Enter email"
        >

        <div class="invalid-feedback">
          Please enter a valid email address.
        </div>
      </div>

      <!-- Password -->
      <div class="mb-3">
        <label for="password" class="form-label">
          Password
        </label>

        <input
          type="password"
          class="form-control"
          id="password"
          placeholder="Enter password"
        >
      </div>

      <!-- Course Dropdown -->
      <div class="mb-3">
        <label for="course" class="form-label">
          Course
        </label>

        <select class="form-select" id="course">
          <option selected>Select a course</option>
          <option>HTML</option>
          <option>CSS</option>
          <option>Bootstrap</option>
        </select>
      </div>

      <!-- Skills -->
      <div class="mb-3">

        <label class="form-label">
          Skills
        </label>

        <div class="form-check">
          <input
            class="form-check-input"
            type="checkbox"
            id="htmlSkill"
          >
          <label class="form-check-label" for="htmlSkill">
            HTML
          </label>
        </div>

        <div class="form-check">
          <input
            class="form-check-input"
            type="checkbox"
            id="cssSkill"
          >
          <label class="form-check-label" for="cssSkill">
            CSS
          </label>
        </div>

        <div class="form-check">
          <input
            class="form-check-input"
            type="checkbox"
            id="bootstrapSkill"
          >
          <label class="form-check-label" for="bootstrapSkill">
            Bootstrap
          </label>
        </div>

      </div>

      <!-- Course Level -->
      <div class="mb-3">

        <label class="form-label">
          Course Level
        </label>

        <div class="form-check">
          <input
            class="form-check-input"
            type="radio"
            name="courseLevel"
            id="beginner"
          >
          <label class="form-check-label" for="beginner">
            Beginner
          </label>
        </div>

        <div class="form-check">
          <input
            class="form-check-input"
            type="radio"
            name="courseLevel"
            id="intermediate"
          >
          <label class="form-check-label" for="intermediate">
            Intermediate
          </label>
        </div>

        <div class="form-check">
          <input
            class="form-check-input"
            type="radio"
            name="courseLevel"
            id="advanced"
          >
          <label class="form-check-label" for="advanced">
            Advanced
          </label>
        </div>

      </div>

      <!-- Notification Switch -->
      <div class="form-check form-switch mb-3">

        <input
          class="form-check-input"
          type="checkbox"
          id="notifications"
        >

        <label class="form-check-label" for="notifications">
          Enable Notifications
        </label>

      </div>

      <!-- Submit Button -->
      <button type="submit" class="btn btn-primary">
        Submit
      </button>

    </form>

  </div>

</body>
</html>
