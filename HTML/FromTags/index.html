<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Basic forms</title>
</head>

<body>
    <fieldset>
        <legend align="center">Basic Form</legend>
        <form>
            <label for="fullName">Full Name - </label>
            <input type="text" name="Yourname" id="fullName" placeholder="Enter Your Name">

            <br>
            <br>

            <label for="email">Enter Your email - </label>
            <input type="text" name="email" id="email" placeholder="email">

            <br>
            <br>

            <label for="password">Password - </label>
            <input type="password" name="password" id="password" placeholder="enter password">

            <br>
            <br>

            <label for="cpassword">confirm Password - </label>
            <input type="password" name="cpassword" id="cpassword" placeholder="enter to confirm password">

            <br>
            <br>

            <label for="dob">enter date</label>
            <input type="date" name="dob" id="dob" placeholder="dob">

            <br>
            <br>

            <label for="tob">enter time</label>
            <input type="time" name="tob" id="tob" placeholder="tob">

            <br>
            <br>

            <label for="joiningTime">joining time</label>
            <input type="datetime-local" name="joiningTime" id="joiningTime" placeholder="enter joining time">

            <br>
            <br>

            <label for="volume">Volumn : </label>
            <input type="range" name="volume" id="volume" min="0" max="5" value="0">

            <br>
            <br>

            <label for="mobile">Mobile number : </label>
            <input type="number" name="mobile" id="mobile" placeholder="+91 xxxxxxxxxx">

            <br>
            <br>

            <label for="age">Age : </label>
            <input type="number" name="age" id="age" placeholder="00">

            <br>
            <br>

            <label for="resume">Resume : </label>
            <br>
            <input type="file" name="resume" id="resume">

            <br>
            <br>

            <label for="address">Address</label>
            <br>
            <textarea name="address" id="address"></textarea>

            <br>
            <br>

            <label for="course"> Course : </label>
            <select name="course" id="course">
                <option value="">Select Option</option>
                <option value="aids">AIDS</option>
                <option value="aiml">AIML</option>
                <option value="ec">EC</option>
                <option value="cse">CSE</option>
            </select>

            <br>
            <br>

            <label for="gender">Gender : </label>

            <input type="radio" name="gender" id="male" value="male">
            <span>Male</span>

            <input type="radio" name="gender" id="female" value="female">
            <span>Female</span>

            <input type="radio" name="gender" id="other" value="other">
            <span>Other</span>

            <br>
            <br>

            <label for="skill">Skills : </label>

            <input type="checkbox" name="skill" id="java" value="java">
            <span>Java</span>

            <input type="checkbox" name="skill" id="female" value="dsa">
            <span>DSA</span>

            <input type="checkbox" name="skill" id="html" value="html">
            <span>HTML</span>

            <br>
            <br>

            <img src="Maheshwar Mishra SmartProfile.jpeg" alt="User img" border="10" width="170px" height="200px">

            <br>
            <br>


            <button>Submit</button>

        </form>
    </fieldset>

</body>

</html>
