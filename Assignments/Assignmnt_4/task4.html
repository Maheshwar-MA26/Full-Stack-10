<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>task 4</title>
</head>
<body>
    <h1>Task 4:</h1>
    <p><u>Create an HTML form as shown in given Image. Use only pure HTML codes.</u></p>
    <table border="1">
        <tr>
            <th colspan="4">Registration Form</th>
        </tr>
        <tr>
            <td><label for="stdname">Student Name</label></td>
            <td><input type="text" name="first" id="stdname" placeholder="First Name"></td>
            <td><input type="text" name="midle" id="stdname" placeholder="Middle Name"></td>
            <td><input type="text" name="last" id="stdname" placeholder="Last Name"></td>
        </tr>
        <tr>
            <td><label for="fathern">Father's Name</label></td>
            <td><input type="text" name="fathername" id="fathern" placeholder="Enter your Father's Name"></td>
            <td><label for="mothern">Mother's Name</label></td>
            <td><input type="text" name="mothername" id="mothern" placeholder="Enter your Mother's Name"></td>
        </tr>
        <tr>
            <td><label for="dobc">Date of Birth</label></td>
            <td><input type="date" name="dob" id="dobc"></td>
            <td><label for="genderd">Gender</label></td>
            <td>
                <input type="radio" name="male" id="genderd" value="male">
                <span>Male</span>
                <input type="radio" name="male" id="genderd" value="feomale">
                <span>Female</span>
            </td>
        </tr>
        <tr>
            <td><label for="categoryc">Category</label></td>
            <td>
                <span>Gen</span>
                <input type="radio" name="v" id="categoryc" value="gen">
                <span>OBC</span>
                <input type="radio" name="v" id="categoryc" value="obc">
                <span>SC/ST</span>
                <input type="radio" name="v" id="categoryc" value="sc_st">
            </td>
            <td><label for="handicappedd">Handicapped</label></td>
            <td>
                <span>Yes</span>
                <input type="radio" name="vd" id="handicappedd" value="yes">
                <span>No</span>
                <input type="radio" name="vd" id="handicappedd" value="no">
            </td>
        </tr>
        <tr>
            <td><label for="exservicemand">Ex-Serviceman</label></td>
            <td>
                <span>Yes</span>
                <input type="radio" name="vc" id="exservicemand" value="yes">
                <span>No</span>
                <input type="radio" name="vc" id="exservicemand" value="no">
            </td>
            <td><label for="ewsd">EWS</label></td>
            <td>
                <span>Yes</span>
                <input type="radio" name="vc" id="ewsd" value="yes">
                <span>No</span>
                <input type="radio" name="vc" id="ewsd" value="no">
            </td>
        </tr>
        <tr>
            <td><label for="emaild">Email ID</label></td>
            <td><input type="text" name="mail" id="emaild"></td>
            <td><label for="callnum">Mobile No.</label></td>
            <td><input type="text" name="number" id="callnum"></td>
        </tr>
        <tr>
            <td><label for="stated">State</label></td>
            <td>
                <select name="state" id="stated">
                    <option value="">Select any One</option>
                    <option value="mp">M.P.</option>
                    <option value="hp">H.P.</option>
                    <option value="up">U.P.</option>
                    <option value="tn">Tamil Nadu</option>
                </select>
            </td>
            <td><label for="cityd">City</label></td>
            <td>
                <select name="city" id="cityd">
                    <option value="">Select any One</option>
                    <option value="bhopal">Bhopal</option>
                    <option value="indore">Indore</option>
                    <option value="ujjain">Ujjain</option>
                    <option value="maheshwar">Maheshwar</option>
                </select>
            </td>
        </tr>
        <tr>
            <td><label for="photod">Upload Photo</label></td>
            <td><input type="file" name="pic" id="photod" <p>No file Selected.</p>
            </td>
            <td><label for="photo">Upload Photo</label<p>No file Selected.</p>
            </td>
            <td><input type="file" name="pic" id="photod"></td>
        </tr>
        <tr>
            <td></td>
            <td colspan="3" align="center"><button type="submit">Submit</button></td>
        </tr>
    </table>
</body>
</html>
