<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>task 2</title>
</head>

<body>
    <h1>Task 2: </h1>
    <p><u>Create an HTML form as shown in given Image. Use only pure HTML
            codes.</u></p>
    <fieldset>
        <h2>Pizza Order Form</h2>
        <br>
        <label for="firstname">First Name: </label>
        <input type="text" name="firstname" id="firstname">
        <br>
        <br>
        <label for="lastname">Last Name: </label>
        <input type="text" name="lastname" id="lastname">
        <br>
        <br>
        <label for="email">Email Address: </label>
        <input type="text" name="email" id="email">
        <br>
        <br>
        <label for="contact">Ocntact Number: </label>
        <input type="number" name="contact" id="contact">
        <br>
        <br>
        <label for="date">Prferred Delivery Date: </label>
        <input type="date" name="date" id="date" placeholder="mm/dd/yyyy">
        <br>
        <br>
        <label for="size">Size: </label>
        <br>
        <input type="radio" name="x" id="size" value="small">
        <span>Small</span>
        <input type="radio" name="x" id="size" value="medium">
        <span>Medium</span>
        <input type="radio" name="x" id="size" value="large">
        <span>Large</span>
        <br>
        <br>
        <label for="flavor">Flavor: </label>
        <br>
        <input type="checkbox" name="hawaiian" id="flavor" value="hawaiian">
        <span>Hawaiin (Php 150.00)</span>
        <select>
            <option value="">1</option>
            <option value="2">2</option>
            <option value="3">3</option>
            <option value="4">4</option>
            <option value="5">5</option>
            <option value="6">6</option>
            <option value="7">7</option>
            <option value="8">8</option>
            <option value="9">9</option>
            <option value="10">10</option>
        </select>
        <br>
        <input type="checkbox" name="pepperoni" id="flavor" value="pepperoni">
        <span>Pepperoni (Php 140.00)</span>
        <select>
            <option value="">1</option>
            <option value="2">2</option>
            <option value="3">3</option>
            <option value="4">4</option>
            <option value="5">5</option>
            <option value="6">6</option>
            <option value="7">7</option>
            <option value="8">8</option>
            <option value="9">9</option>
            <option value="10">10</option>
        </select>
        <br>
        <input type="checkbox" name="vegetable" id="flavor" value="hawaiian">
        <span>Vegetable (Php 130.00)</span>
        <select>
            <option value="">1</option>
            <option value="2">2</option>
            <option value="3">3</option>
            <option value="4">4</option>
            <option value="5">5</option>
            <option value="6">6</option>
            <option value="7">7</option>
            <option value="8">8</option>
            <option value="9">9</option>
            <option value="10">10</option>
        </select>
        <br>
        <br>
        <label for="card">Credit Card Number: </label>
        <input type="number" name="credit" id="card">
        <br>
        <br>
        <label for="pin">PIN: </label>
        <input type="number" name="pin" id="pin">
        <br>
        <br>
        <label for="note">Additional Note: </label>
        <br>
        <textarea name="notes" id="note"></textarea>
        <br>
        <br>
        <button>Submit Order</button>
    </fieldset>

</body>

</html>
