<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="container">

        <div class="form-box">
            <h2>Login</h2>

            <form>
                <div class="input-box">
                    <span>✉</span>
                    <input type="email" placeholder="Enter your email">
                </div>

                <div class="input-box">
                    <span>🔒</span>
                    <input type="password" placeholder="Confirm a password">
                    <span>◉</span>
                </div>

                <div class="options">
                    <label>
                        <input type="checkbox">
                        Remember me
                    </label>

                    <a href="#">Forgot password?</a>
                </div>

                <button type="submit">Login Now</button>

                <p>
                    Don't have an account?
                    <a href="register.html">Signup now</a>
                </p>
            </form>
        </div>

    </div>

</body>

</html>
